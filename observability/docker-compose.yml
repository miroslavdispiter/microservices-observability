# Observability stack za TravelPlannerApp: Application Metrics + Distributed Tracing.
#
# Mikroservisi (WebApiService, UserService, TravelService, SharingService) i dalje rade
# kao Service Fabric aplikacija na lokalnom klasteru (Visual Studio -> F5), u skladu sa
# preporukom mentora. Ovaj docker-compose stack pokrece SAMO alate za observability:
#
#   Prometheus  - SKREJPUJE (pull) /metrics endpointe servisa sa host masine
#   Jaeger      - PRIMA (push) OTLP span-ove koje servisi salju na localhost:4317
#   Grafana     - objedinjeni prikaz: metrike iz Prometheus-a + trace-ovi iz Jaeger-a
#
# Obratiti paznju na suprotan smer komunikacije: metrike Prometheus povlaci sam, dok
# trace-ove servisi guraju ka Jaeger-u. Zato Jaeger mora da bude pokrenut (ili barem
# port 4317 dostupan) da bi span-ovi bili sacuvani - OTLP exporter u servisima tiho
# odustaje ako ne uspe da se poveze i span-ovi se gube.
#
# Pokretanje:
#   1. cd observability
#   2. docker compose up -d
#   3. Pokrenuti TravelPlannerApp Service Fabric aplikaciju iz Visual Studio (F5).
#   4. Prometheus:  http://localhost:9090
#      Jaeger UI:   http://localhost:16686
#      Grafana:     http://localhost:3001  (admin / admin)

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: travelplanner-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Distributed Tracing backend. Jedinstveni binarni image koji u jednom procesu sadrzi
  # collector (prijem OTLP span-ova), skladiste i query/UI. Skladiste je in-memory -
  # dovoljno za lokalni razvoj i demonstraciju, ali se trace-ovi gube pri restartu
  # kontejnera. Jaeger v1 je van podrske od 31.12.2025, pa se koristi v2 linija.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: travelplanner-jaeger
    ports:
      - "16686:16686"   # Jaeger UI i query API (Grafana ga koristi kao datasource)
      - "4317:4317"     # OTLP/gRPC - ovde servisi salju span-ove
      - "4318:4318"     # OTLP/HTTP - alternativa ako gRPC nije opcija
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: travelplanner-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  grafana-data:
